# ---------------------------------------------------------------------------
# 西南财经大学金融投资协会官网 · Nginx 站点配置
#
# 放置位置（Ubuntu/Debian）：
#   /etc/nginx/sites-available/fia.conf
# 启用：
#   ln -s /etc/nginx/sites-available/fia.conf /etc/nginx/sites-enabled/fia.conf
#   rm -f /etc/nginx/sites-enabled/default      # 移除默认站点，否则 80 端口冲突
#   nginx -t && systemctl reload nginx
#
# ⚠️ 替换项：把所有 <你的域名> 换成实际域名，例如 fia-swufe.com
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 1) HTTP → HTTPS 跳转
#    保留 .well-known/acme-challenge 的直通，否则证书续期会失败。
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name <你的域名> www.<你的域名>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2) HTTPS 主站
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <你的域名> www.<你的域名>;

    # ---- 证书（certbot 会自动写入这两行；也可见 deploy/README.md 第 7 步）----
    ssl_certificate     /etc/letsencrypt/live/<你的域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<你的域名>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 站点用 createHashRouter（根路径 /#/），不需要 CSP 放行外部脚本，
    # 但注意 design-mode 插件只在开发态注入，生产构建不含它。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 前端静态产物 ----
    root /var/www/fia/current/dist;
    index index.html;

    # 构建产物带内容哈希，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # createHashRouter：所有前端路由都落在 /#/ 之后，
    # 不带 hash 的路径只有 / 一个入口，故 try_files 回落到 index.html 即可。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # 后端反向代理
    #
    # 前端通过同源 /api 访问后端，因此这里必须完整透传：
    # - Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Proto 缺一不可，
    #   否则后端 clientIp() 拿不到真实 IP（登录限流会全站共用一桶）
    #   且 HTTPS 判定可能出错。
    # - 后端必须配 TRUST_PROXY=true 才会采信 XFF，见 deploy/README.md。
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 资料库有数十 MB 的 PDF 下载/预览，超时必须放宽，
        # 否则大文件传到一半被 Nginx 掐断（表现：下载中断、预览空白）。
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 关闭代理缓冲，让 Range 请求与流式下载直通，
        # 这样前端 PDF 预览的分段拉取才能正常工作。
        proxy_buffering off;
        proxy_request_buffering off;

        # 后台上传接口上限 200 MB（见 app.js 的 uploadMaxBytes）
        client_max_body_size 210m;
    }

    # 上传接口单独放宽，语义更明确（其余接口不需要这么大）
    location /api/admin/resources/upload {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        client_max_body_size 210m;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_buffering off;
    }

    # ---- gzip（构建产物是 JS/CSS，压缩收益显著）----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 已经 gzip 过的格式不要重复压缩
    gzip_disable "msie6";

    access_log /var/log/nginx/fia.access.log;
    error_log  /var/log/nginx/fia.error.log;
}
